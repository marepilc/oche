name: Release

# Pushing a tag like v0.1.0 builds every package and publishes the release:
# the draft gets the CHANGELOG section as notes, both builds attach their files,
# and the release goes public only when all of them succeeded.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$version" '/^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Oche $TAG" > notes.md
          gh release create "$TAG" --draft --verify-tag --title "Oche $TAG" --notes-file notes.md
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  bundles:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # .deb, .rpm and AppImage
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}

  arch:
    needs: draft
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed git nodejs npm rust webkit2gtk-4.1 gtk3 fontconfig hicolor-icon-theme github-cli

      - uses: actions/checkout@v7

      - name: Build the package
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder: .
          sudo -u builder git config --global --add safe.directory "$PWD"
          sudo -u builder packaging/arch/build-local.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" packaging/arch/out/*.pkg.tar.zst --repo "${{ github.repository }}" --clobber

  publish:
    needs: [bundles, arch]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
